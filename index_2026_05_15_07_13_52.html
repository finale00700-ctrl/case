<!DOCTYPE html><html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B3A6B"><link rel="manifest" href="manifest.json">
<title>뇌건강 인지훈련 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
:root{--navy:#1B3A6B;--blue:#2E6DB4;--lblue:#D6E4F0;--green:#1A7A4A;--lgreen:#D6F0E2;--orange:#BA7517;--lorange:#FFF3E0;--red:#C0392B;--lred:#FDECEA;--gray:#F5F7FA;--lgray:#E2E8F0;--text:#1a1a2e;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Apple SD Gothic Neo','맑은 고딕',sans-serif}
body{background:#F0F4F8;color:var(--text);display:flex;flex-direction:column}
.hdr{background:var(--navy);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:14px}
.page.on{display:block}.page::-webkit-scrollbar{width:0}
.bnav{background:#fff;border-top:1px solid var(--lgray);display:flex;flex-shrink:0}
.nb{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;color:var(--muted);font-size:10px;font-family:inherit}
.nb i{font-size:22px}.nb.on{color:var(--blue)}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ct{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.mtr{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.mtr .v{font-size:26px;font-weight:700;margin-bottom:2px}.mtr .l{font-size:11px;color:var(--muted)}
.ntf{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:13px;line-height:1.5}
.ntf.w{background:var(--lorange);color:#92400e}.ntf.d{background:var(--lred);color:#991b1b}
.ntf.ok{background:var(--lgreen);color:#166534}.ntf.i{background:var(--lblue);color:#1e40af}
.ntf i{font-size:16px;flex-shrink:0;margin-top:1px}
.mrow{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;border:2px solid transparent}
.mrow.sel{border-color:var(--blue);background:#EFF6FF}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.bdg{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
.bdg.ok{background:var(--lgreen);color:#166534}.bdg.w{background:var(--lorange);color:#92400e}
.bdg.d{background:var(--lred);color:#991b1b}.bdg.i{background:var(--lblue);color:#1e40af}.bdg.g{background:var(--lgray);color:var(--muted)}
.bw{height:6px;background:var(--lgray);border-radius:3px;overflow:hidden}
.bf{height:100%;border-radius:3px;transition:width .5s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--lgray);background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.s{background:var(--green);border-color:var(--green);color:#fff}
.btn.dr{background:var(--red);border-color:var(--red);color:#fff}
.btn.f{width:100%;padding:14px;font-size:14px;border-radius:14px;margin-top:4px}
.btr{display:flex;gap:8px}.btr .btn{flex:1;font-size:12px;padding:9px 8px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--lgray);font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.fg{margin-bottom:12px}.fl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block}
.ew{background:#fff;border-radius:20px;padding:24px 20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.bb{width:100%;padding:20px;border-radius:18px;border:none;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px}
.bb.st{background:var(--navy);color:#fff}.bb.su{background:var(--gray);color:var(--muted);font-size:16px;padding:16px}
.bb.sp{background:var(--lred);color:var(--red)}.bb.hm{background:var(--lgreen);color:var(--green);font-size:18px;padding:18px}
.sbig{font-size:72px;font-weight:800;line-height:1;margin:10px 0 4px;transition:color .4s}
.bic{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:50px}
.mdbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.md{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-height:85vh;overflow-y:auto}
.mdtl{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.tst{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;white-space:nowrap}
.tst.on{opacity:1}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.dm{background:var(--gray);border-radius:12px;padding:10px;text-align:center}
.dm .v{font-size:22px;font-weight:700}.dm .l{font-size:10px;color:var(--muted);margin-top:2px}
.hi{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--lgray)}
.hi:last-child{border-bottom:none}
.sc{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
</style>
</head><body>
<div class="hdr">
  <div style="font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px"><i class="ti ti-brain" style="font-size:22px;color:#7FB3E8"></i>뇌건강 인지훈련</div>
  <div style="font-size:11px;opacity:.75;display:flex;align-items:center;gap:8px"><span id="hd"></span><span id="hc" style="font-family:monospace"></span></div>
</div>
<div class="pages">
<div class="page on" id="page-dash">
  <div class="g4" id="dm"></div>
  <div class="card" id="da"></div>
  <div class="card"><div class="ct">입소자별 주간 평균</div><div id="db"></div></div>
  <div class="card"><div class="ct">기관 월간 추이</div><canvas id="tc" height="150"></canvas></div>
</div>
<div class="page" id="page-members">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-size:14px;font-weight:600">입소자 <span id="mc" style="color:var(--muted);font-weight:400;font-size:13px"></span></div>
    <button class="btn" style="font-size:12px;padding:8px 12px" onclick="openA()"><i class="ti ti-plus"></i>등록</button>
  </div>
  <div id="ml"></div>
  <div id="dc" style="display:none"><div class="card" style="border:2px solid var(--blue)">
    <div class="ct" style="display:flex;justify-content:space-between"><span>입소자 상세</span>
      <button onclick="closeD()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted)"><i class="ti ti-x"></i></button>
    </div><div id="dd"></div>
  </div></div>
</div>
<div class="page" id="page-elder">
  <div style="font-size:11px;color:var(--muted);margin-bottom:12px;text-align:center"><i class="ti ti-device-tablet"></i> 어르신이 직접 보는 화면</div>
  <div class="ew">
    <div id="es-sel">
      <div class="bic" style="background:var(--lblue)">🧠</div>
      <div style="font-size:28px;font-weight:800;color:var(--navy);margin-bottom:6px">안녕하세요!</div>
      <div style="font-size:17px;color:var(--muted);margin-bottom:20px">누구세요?</div>
      <div id="ep" style="display:flex;flex-direction:column;gap:8px;text-align:left"></div>
    </div>
    <div id="es-0" style="display:none">
      <div class="bic" style="background:var(--lblue)">🧠</div>
      <div style="font-size:26px;font-weight:800;color:var(--navy);margin-bottom:4px" id="eg"></div>
      <div style="font-size:16px;color:var(--muted);margin-bottom:22px">오늘도 두뇌 훈련 해볼까요?</div>
      <button class="bb st" onclick="goE(1)"><i class="ti ti-player-play"></i>훈련 시작</button>
      <button class="bb su" onclick="goE(3)"><i class="ti ti-chart-bar"></i>내 기록 보기</button>
      <button class="bb su" style="font-size:13px;padding:12px;color:var(--muted)" onclick="goE('sel')"><i class="ti ti-arrow-left"></i>다른 분</button>
    </div>
    <div id="es-1" style="display:none">
      <div style="font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px">집중력 훈련 중</div>
      <div style="font-size:14px;color:var(--muted);margin-bottom:18px">음악을 들으며 집중해보세요</div>
      <div class="bw" style="height:14px;margin-bottom:18px;border-radius:7px"><div class="bf" id="epb" style="width:0%;background:var(--blue);border-radius:7px;transition:width 1s"></div></div>
      <div style="font-size:48px;font-weight:300;font-family:monospace;color:var(--navy);margin-bottom:8px" id="et">05:00</div>
      <div style="font-size:14px;color:var(--muted);margin-bottom:4px">집중도 점수</div>
      <div class="sbig" id="es2" style="color:var(--muted)">--</div>
      <div style="font-size:15px;color:var(--muted);margin:8px 0 22px;min-height:24px" id="em">잠시 후 시작됩니다...</div>
      <button class="bb sp" onclick="stopE()"><i class="ti ti-player-stop"></i>훈련 마치기</button>
    </div>
    <div id="es-2" style="display:none">
      <div class="bic" style="background:var(--lgreen)">⭐</div>
      <div style="font-size:30px;font-weight:800;color:var(--green);margin-bottom:6px">잘 하셨어요!</div>
      <div style="font-size:16px;color:var(--muted);margin-bottom:14px">오늘 훈련이 끝났습니다</div>
      <div style="font-size:14px;color:var(--muted);margin-bottom:4px">오늘 점수</div>
      <div class="sbig" id="ef" style="color:var(--green)">--</div>
      <div style="font-size:15px;margin:10px 0 22px" id="ecmp"></div>
      <button class="bb hm" onclick="goE(0)"><i class="ti ti-home"></i>처음으로</button>
    </div>
    <div id="es-3" style="display:none">
      <div style="font-size:22px;font-weight:800;color:var(--navy);margin-bottom:16px">내 훈련 기록</div>
      <div id="ehs" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px"></div>
      <div id="ehl"></div>
      <button class="bb hm" style="margin-top:16px" onclick="goE(0)"><i class="ti ti-arrow-left"></i>돌아가기</button>
    </div>
  </div>
</div>
<div class="page" id="page-report">
  <div id="rs"></div>
  <div class="card"><div class="ct">훈련 기록 직접 입력</div>
    <div class="fg"><label class="fl">입소자 선택</label><select id="rm"></select></div>
    <div class="fg"><label class="fl">집중도 점수 (0~100)</label><input type="number" id="rsc" min="0" max="100" placeholder="예: 68"></div>
    <div class="fg"><label class="fl">메모 (선택)</label><textarea id="rmo" rows="2" placeholder="오늘 컨디션, 특이사항"></textarea></div>
    <button class="btn s f" onclick="saveRec()"><i class="ti ti-check"></i>기록 저장</button>
  </div>
  <div class="card"><div class="ct">보호자 리포트 발송</div><div id="rl"></div>
    <button class="btn p f" style="margin-top:8px" onclick="toast('전체 보호자에게 리포트가 발송되었습니다!')"><i class="ti ti-send"></i>전체 발송</button>
  </div>
</div>
</div>
<div class="bnav">
  <button class="nb on" id="bn-dash" onclick="showP('dash')"><i class="ti ti-layout-dashboard"></i>대시보드</button>
  <button class="nb" id="bn-members" onclick="showP('members')"><i class="ti ti-users"></i>입소자</button>
  <button class="nb" id="bn-elder" onclick="showP('elder')"><i class="ti ti-armchair"></i>훈련화면</button>
  <button class="nb" id="bn-report" onclick="showP('report')"><i class="ti ti-file-text"></i>기록입력</button>
</div>
<div class="mdbg" id="amd" style="display:none" onclick="if(event.target===this)closeA()">
  <div class="md">
    <div class="mdtl"><span id="mtl">입소자 등록</span><button onclick="closeA()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted)"><i class="ti ti-x"></i></button></div>
    <div class="fg"><label class="fl">성함</label><input id="fn" placeholder="예: 김순자"></div>
    <div class="fg"><label class="fl">나이</label><input id="fa" type="number" placeholder="예: 78"></div>
    <div class="fg"><label class="fl">호실</label><input id="fr" placeholder="예: 101호"></div>
    <div class="fg"><label class="fl">성별</label><select id="fgn"><option value="여">여성</option><option value="남">남성</option></select></div>
    <div class="fg"><label class="fl">보호자 연락처</label><input id="fgu" placeholder="010-0000-0000"></div>
    <div class="fg"><label class="fl">특이사항</label><textarea id="fno" rows="2" placeholder="질환, 주의사항 등"></textarea></div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn f" onclick="closeA()">취소</button>
      <button class="btn p f" onclick="saveM()"><i class="ti ti-check"></i>저장</button>
    </div>
  </div>
</div>
<div class="tst" id="tst"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
const DM=[{id:'m1',name:'김순자',age:78,room:'101호',gender:'여',guardian:'010-3421-5678',note:'경도 인지 저하',color:'#1B3A6B'},{id:'m2',name:'박영길',age:83,room:'102호',gender:'남',guardian:'010-5512-3344',note:'고혈압 주의',color:'#7F77DD'},{id:'m3',name:'이정숙',age:75,room:'103호',gender:'여',guardian:'010-2233-9988',note:'',color:'#1A7A4A'},{id:'m4',name:'최봉수',age:81,room:'104호',gender:'남',guardian:'010-7890-1234',note:'청력 저하',color:'#BA7517'},{id:'m5',name:'정명희',age:72,room:'105호',gender:'여',guardian:'010-6677-4455',note:'',color:'#D85A30'}];
const DR={m1:[{date:'2025-05-07',score:66,memo:''},{date:'2025-05-09',score:68,memo:'컨디션 좋음'},{date:'2025-05-12',score:71,memo:''},{date:'2025-05-13',score:69,memo:''}],m2:[{date:'2025-05-07',score:61,memo:''},{date:'2025-05-09',score:58,memo:'피곤해함'},{date:'2025-05-12',score:55,memo:''},{date:'2025-05-13',score:53,memo:'수면 부족'}],m3:[{date:'2025-05-07',score:52,memo:''},{date:'2025-05-09',score:48,memo:''},{date:'2025-05-12',score:44,memo:'무기력 호소'},{date:'2025-05-13',score:42,memo:''}],m4:[{date:'2025-05-08',score:60,memo:''},{date:'2025-05-09',score:63,memo:''},{date:'2025-05-13',score:65,memo:'향상 중'}],m5:[{date:'2025-05-07',score:67,memo:''},{date:'2025-05-09',score:69,memo:''},{date:'2025-05-12',score:70,memo:''},{date:'2025-05-13',score:71,memo:'이번 주 최고'}]};
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function sd(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let M=ld('mbrs',DM),R=ld('recs',DR),eid=null,selEld=null,etmr=null,eatt=25,esec=300,tc=null;
const TODAY=new Date().toISOString().slice(0,10);
const COLS=['#1B3A6B','#7F77DD','#1A7A4A','#BA7517','#D85A30','#0F6E56','#534AB7','#3B6D11'];
function gc(s){return s>=70?'#1A7A4A':s>=50?'#BA7517':'#C0392B';}
function gs(s){return s>=70?'ok':s>=50?'w':'d';}
function gl(s){return s>=70?'양호':s>=50?'주의':'위험';}
function wavg(id){const r=R[id]||[];if(!r.length)return null;const sl=r.slice(-5);return Math.round(sl.reduce((a,b)=>a+b.score,0)/sl.length);}
function tdone(id){return(R[id]||[]).some(r=>r.date===TODAY);}
function fdt(d){const x=new Date(d);return`${x.getMonth()+1}/${x.getDate()}`;}
function todayStr(){const d=new Date();return`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`;}
function uc(){document.getElementById('hc').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}
document.getElementById('hd').textContent=todayStr();setInterval(uc,1000);uc();
function toast(msg){const t=document.getElementById('tst');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500);}
function showP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));document.getElementById('page-'+id).classList.add('on');document.getElementById('bn-'+id).classList.add('on');if(id==='dash')rD();if(id==='members')rM();if(id==='elder')rEP();if(id==='report')rR();}
function rD(){
  const tot=M.length,dn=M.filter(m=>tdone(m.id)).length,nd=tot-dn;
  const dg=M.filter(m=>{const r=R[m.id]||[];return r.length>=3&&r.slice(-3).every((x,i,a)=>i===0||x.score<a[i-1].score);}).length;
  document.getElementById('dm').innerHTML=`<div class="mtr"><div class="v" style="color:var(--navy)">${tot}</div><div class="l">전체</div></div><div class="mtr"><div class="v" style="color:var(--green)">${dn}</div><div class="l">훈련완료</div></div><div class="mtr"><div class="v" style="color:var(--orange)">${nd}</div><div class="l">미훈련</div></div><div class="mtr"><div class="v" style="color:var(--red)">${dg}</div><div class="l">주의</div></div>`;
  let al='<div class="ct">알림</div>';
  const dgM=M.filter(m=>{const r=R[m.id]||[];return r.length>=3&&r.slice(-3).every((x,i,a)=>i===0||x.score<a[i-1].score);});
  dgM.forEach(m=>{al+=`<div class="ntf d"><i class="ti ti-alert-triangle"></i><span><b>${m.name}</b> — 3회 연속 점수 하락</span></div>`;});
  const ndM=M.filter(m=>!tdone(m.id));
  if(ndM.length)al+=`<div class="ntf w"><i class="ti ti-clock"></i><span><b>${ndM.map(m=>m.name).join('·')}</b> — 오늘 미훈련</span></div>`;
  M.filter(m=>{const r=R[m.id]||[];return r.length>=2&&r[r.length-1].score>r[r.length-2].score+3;}).forEach(m=>{al+=`<div class="ntf ok"><i class="ti ti-trophy"></i><span><b>${m.name}</b> — 점수 향상 중!</span></div>`;});
  if(!dgM.length&&!ndM.length)al+=`<div class="ntf i"><i class="ti ti-check"></i><span>오늘 특이사항 없음</span></div>`;
  document.getElementById('da').innerHTML=al;
  document.getElementById('db').innerHTML=M.map(m=>{const s=wavg(m.id)||0;return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px"><span style="font-size:13px;width:48px;color:var(--muted)">${m.name}</span><div class="bw" style="flex:1"><div class="bf" style="width:${s}%;background:${gc(s)}"></div></div><span style="font-size:13px;font-family:monospace;font-weight:600;width:32px;text-align:right">${s||'--'}</span></div>`;}).join('');
  if(tc){tc.destroy();tc=null;}
  const cv=document.getElementById('tc');if(!cv)return;
  const all=Object.values(R).flat().map(r=>r.score);
  const base=all.length?Math.round(all.reduce((a,b)=>a+b)/all.length):62;
  tc=new Chart(cv,{type:'line',data:{labels:['1주','2주','3주','4주','이번주'],datasets:[{data:[base-6,base-3,base-2,base-1,base],borderColor:'#2E6DB4',backgroundColor:'rgba(46,109,180,.1)',borderWidth:2,pointRadius:4,pointBackgroundColor:'#2E6DB4',fill:true,tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:Math.max(0,base-20),max:Math.min(100,base+20),ticks:{font:{size:11}},grid:{color:'rgba(0,0,0,.05)'}},x:{ticks:{font:{size:11}},grid:{display:false}}}}});
}
function rM(){
  document.getElementById('mc').textContent=`(${M.length}명)`;
  document.getElementById('ml').innerHTML=M.map(m=>{const s=wavg(m.id)||0;return`<div class="mrow" id="mr-${m.id}" onclick="selM('${m.id}')"><div class="av" style="background:${m.color}22;color:${m.color}">${m.name[0]}</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;margin-bottom:5px"><span style="font-size:15px;font-weight:700">${m.name}</span><span style="font-size:12px;color:var(--muted)">${m.age}세·${m.room}</span></div><div style="display:flex;align-items:center;gap:6px"><div class="bw" style="width:80px"><div class="bf" style="width:${s}%;background:${gc(s)}"></div></div><span style="font-size:12px;font-family:monospace;font-weight:600">${s||'--'}점</span></div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span class="bdg ${gs(s)}">${gl(s)}</span><span class="bdg ${tdone(m.id)?'i':'g'}">${tdone(m.id)?'완료':'미훈련'}</span></div></div>`;}).join('');
}
function selM(id){
  document.querySelectorAll('.mrow').forEach(r=>r.classList.remove('sel'));
  const el=document.getElementById('mr-'+id);if(el)el.classList.add('sel');
  const m=M.find(x=>x.id===id);if(!m)return;
  const s=wavg(id)||0,recs=R[id]||[];
  const last=recs.length?recs[recs.length-1].score:null;
  const prev=recs.length>=2?recs[recs.length-2].score:null;
  const diff=last&&prev?last-prev:null;
  const dc=document.getElementById('dc');dc.style.display='block';
  setTimeout(()=>dc.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
  const hist=recs.slice(-5).reverse().map(r=>`<div class="hi"><div class="sc" style="background:${gc(r.score)}22;color:${gc(r.score)}">${r.score}</div><div style="flex:1"><div style="font-size:13px;font-weight:600">${fdt(r.date)}</div><div style="font-size:11px;color:var(--muted)">${r.memo||'메모 없음'}</div></div></div>`).join('')||'<div style="font-size:13px;color:var(--muted);padding:8px 0">기록 없음</div>';
  document.getElementById('dd').innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--lgray)"><div class="av" style="width:52px;height:52px;font-size:18px;background:${m.color}22;color:${m.color}">${m.name[0]}</div><div><div style="font-size:17px;font-weight:700">${m.name} <span style="font-size:13px;color:var(--muted);font-weight:400">${m.age}세·${m.room}·${m.gender}성</span></div><div style="font-size:12px;color:var(--muted);margin-top:2px">보호자: ${m.guardian}</div>${m.note?`<div style="font-size:12px;color:var(--orange);margin-top:2px">⚠ ${m.note}</div>`:''}</div></div><div class="dg"><div class="dm"><div class="v" style="color:${gc(s)}">${s||'--'}점</div><div class="l">주간 평균</div></div><div class="dm"><div class="v" style="color:${diff===null?'var(--muted)':diff>=0?'var(--green)':'var(--red)'}">${diff===null?'--':diff>=0?'▲'+diff:'▼'+Math.abs(diff)}점</div><div class="l">전회 대비</div></div><div class="dm"><div class="v">${recs.length}회</div><div class="l">총 훈련</div></div><div class="dm"><div class="v">${tdone(id)?'완료':'미완료'}</div><div class="l">오늘</div></div></div><div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px">최근 기록</div>${hist}<div class="btr" style="margin-top:12px"><button class="btn p" onclick="toast('${m.name} 보호자에게 리포트를 발송했습니다!')"><i class="ti ti-mail"></i>리포트</button><button class="btn" onclick="openE2('${id}')"><i class="ti ti-edit"></i>수정</button><button class="btn dr" onclick="delM('${id}')"><i class="ti ti-trash"></i>삭제</button></div>`;
}
function closeD(){document.getElementById('dc').style.display='none';document.querySelectorAll('.mrow').forEach(r=>r.classList.remove('sel'));}
function openA(){eid=null;document.getElementById('mtl').textContent='입소자 등록';['fn','fa','fr','fgu','fno'].forEach(f=>document.getElementById(f).value='');document.getElementById('fgn').value='여';document.getElementById('amd').style.display='flex';}
function openE2(id){eid=id;const m=M.find(x=>x.id===id);if(!m)return;document.getElementById('mtl').textContent='정보 수정';document.getElementById('fn').value=m.name;document.getElementById('fa').value=m.age;document.getElementById('fr').value=m.room;document.getElementById('fgn').value=m.gender;document.getElementById('fgu').value=m.guardian;document.getElementById('fno').value=m.note;document.getElementById('amd').style.display='flex';}
function closeA(){document.getElementById('amd').style.display='none';}
function saveM(){const name=document.getElementById('fn').value.trim();const age=parseInt(document.getElementById('fa').value)||0;const room=document.getElementById('fr').value.trim();if(!name||!age||!room){toast('성함, 나이, 호실은 필수입니다');return;}if(eid){const i=M.findIndex(x=>x.id===eid);if(i>=0)M[i]={...M[i],name,age,room,gender:document.getElementById('fgn').value,guardian:document.getElementById('fgu').value.trim(),note:document.getElementById('fno').value.trim()};}else M.push({id:'m'+Date.now(),name,age,room,gender:document.getElementById('fgn').value,guardian:document.getElementById('fgu').value.trim(),note:document.getElementById('fno').value.trim(),color:COLS[M.length%COLS.length]});sd('mbrs',M);closeA();rM();rD();toast(eid?'수정되었습니다':'등록되었습니다');}
function delM(id){if(!confirm('삭제하시겠습니까?'))return;M=M.filter(m=>m.id!==id);delete R[id];sd('mbrs',M);sd('recs',R);closeD();rM();rD();toast('삭제되었습니다');}
function rEP(){document.getElementById('ep').innerHTML=M.map(m=>`<button onclick="pickE('${m.id}')" style="display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1.5px solid var(--lgray);background:#fff;cursor:pointer;font-family:inherit;text-align:left;width:100%"><div class="av" style="width:44px;height:44px;background:${m.color}22;color:${m.color};font-size:16px">${m.name[0]}</div><div><div style="font-size:16px;font-weight:700;color:var(--text)">${m.name} 어르신</div><div style="font-size:12px;color:var(--muted)">${m.room}·${m.age}세</div></div></button>`).join('');goE('sel');}
function pickE(id){selEld=id;const m=M.find(x=>x.id===id);document.getElementById('eg').textContent=`${m.name} 어르신!`;goE(0);}
function goE(n){['sel',0,1,2,3].forEach(i=>{const el=document.getElementById('es-'+(i==='sel'?'sel':i));if(el)el.style.display='none';});const t=document.getElementById('es-'+(n==='sel'?'sel':n));if(t)t.style.display='block';if(n===1)startE();else if(etmr){clearInterval(etmr);etmr=null;}if(n===3)rEH();}
function startE(){esec=300;eatt=25;etmr=setInterval(()=>{esec=Math.max(0,esec-1);const m2=Math.floor(esec/60),s2=esec%60;document.getElementById('et').textContent=`${String(m2).padStart(2,'0')}:${String(s2).padStart(2,'0')}`;document.getElementById('epb').style.width=Math.round((1-esec/300)*100)+'%';const tg=35+Math.sin(Date.now()/7000)*30+Math.random()*18;eatt+=(tg-eatt)*.08;eatt=Math.max(8,Math.min(96,eatt));const sc=Math.round(eatt);const el=document.getElementById('es2');el.textContent=sc;el.style.color=gc(sc);document.getElementById('em').textContent=sc>=70?'아주 잘 하고 계세요! 🎉':sc>=50?'집중해보세요 😊':'음악에 귀를 기울여보세요';if(esec<=0)stopE();},1000);}
function stopE(){if(etmr){clearInterval(etmr);etmr=null;}const fs=Math.round(eatt);document.getElementById('ef').textContent=fs;if(selEld){if(!R[selEld])R[selEld]=[];const prev=(R[selEld].slice(-1)[0]||{}).score;const diff=prev?fs-prev:null;const cmp=document.getElementById('ecmp');cmp.textContent=diff===null?'첫 번째 훈련입니다!':diff>=0?`지난번보다 ${diff}점 올랐어요! 🎉`:`지난번보다 ${Math.abs(diff)}점 줄었어요. 다음엔 더 잘할 거예요!`;cmp.style.color=diff===null?'var(--muted)':diff>=0?'var(--green)':'var(--orange)';R[selEld].push({date:TODAY,score:fs,memo:'훈련 화면 자동 저장'});sd('recs',R);}goE(2);}
function rEH(){if(!selEld)return;const recs=(R[selEld]||[]).slice(-5);const av2=recs.length?Math.round(recs.reduce((a,b)=>a+b.score,0)/recs.length):0;document.getElementById('ehs').innerHTML=`<div class="dm"><div class="v" style="color:var(--blue)">${av2||'--'}점</div><div class="l">최근 평균</div></div><div class="dm"><div class="v">${(R[selEld]||[]).length}회</div><div class="l">총 훈련</div></div>`;document.getElementById('ehl').innerHTML=recs.slice().reverse().map(r=>`<div class="hi"><div class="sc" style="background:${gc(r.score)}22;color:${gc(r.score)}">${r.score}</div><div style="flex:1"><div style="font-size:14px;font-weight:600">${fdt(r.date)}</div><div style="font-size:12px;color:var(--muted)">${r.memo||'메모 없음'}</div></div></div>`).join('')||'<div style="font-size:13px;color:var(--muted)">기록 없음</div>';}
function rR(){const all=Object.values(R).flat().map(r=>r.score);const av2=all.length?Math.round(all.reduce((a,b)=>a+b)/all.length):0;const tot=all.length;const prt=M.filter(m=>(R[m.id]||[]).length>0).length;document.getElementById('rs').innerHTML=`<div class="card"><div class="ct">이달 기관 종합</div><div class="g4"><div class="mtr"><div class="v" style="color:var(--blue)">${av2||'--'}점</div><div class="l">기관 평균</div></div><div class="mtr"><div class="v">${tot}회</div><div class="l">총 훈련</div></div><div class="mtr"><div class="v">${M.length}명</div><div class="l">입소자</div></div><div class="mtr"><div class="v" style="color:var(--green)">${M.length?Math.round(prt/M.length*100):0}%</div><div class="l">참여율</div></div></div></div>`;const sel=document.getElementById('rm');sel.innerHTML=M.map(m=>`<option value="${m.id}">${m.name} (${m.room})</option>`).join('');document.getElementById('rl').innerHTML=M.map(m=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--lgray)"><div class="av" style="width:34px;height:34px;font-size:12px;background:${m.color}22;color:${m.color}">${m.name[0]}</div><div style="flex:1"><div style="font-size:13px;font-weight:600">${m.name}</div><div style="font-size:11px;color:var(--muted)">${m.guardian}</div></div><span class="bdg ok" style="cursor:pointer" onclick="toast('${m.name} 보호자에게 발송했습니다!')">발송</span></div>`).join('');}
function saveRec(){const id=document.getElementById('rm').value;const score=parseInt(document.getElementById('rsc').value);const memo=document.getElementById('rmo').value.trim();if(!id||isNaN(score)||score<0||score>100){toast('점수를 확인해주세요 (0~100)');return;}if(!R[id])R[id]=[];R[id].push({date:TODAY,score,memo});sd('recs',R);document.getElementById('rsc').value='';document.getElementById('rmo').value='';rR();rD();toast('기록이 저장되었습니다!');}
rD();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
